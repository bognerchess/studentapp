# Options for the generators behind tool/gen.sh. See docs/storage.md (drift)
# and graphql/SCHEMA_SOURCE.md (GraphQL).
targets:
  $default:
    # The defaults that matter here plus graphql/**, where the schema and the
    # operations live (outside lib/, so that they are neither bundled nor
    # analysed).
    sources:
      - $package$
      - lib/**
      - test/**
      - pubspec.*
      - graphql/**
    builders:
      drift_dev:
        # Only the storage layer contains drift code; this keeps the generator
        # away from everything else (tool/test_fixtures/ does not even compile).
        generate_for:
          - lib/core/storage/**
      graphql_codegen:
        generate_for:
          - graphql/**
        options:
          assetsPath: graphql/**
          # graphql/x.graphql -> lib/core/api/generated/x.graphql.dart. A
          # generated/ directory is exempt from format, headers and lints.
          outputDirectory: /lib/core/api/generated
          # No client helpers: lib/core/api/api_executor.dart runs the
          # documents itself, so that errors and time-outs are mapped in one
          # place.
          clients: []
          # Nothing is normalised into a cache, so __typename is only selected
          # where a union needs it (the errors of every mutation).
          addTypename: false
          # copyWith would double the generated code; nothing here mutates a
          # response.
          disableCopyWithGeneration: true
          generatedFileHeader: "// GENERATED by graphql_codegen from graphql/. Do not edit; run tool/gen.sh.\n// ignore_for_file: type=lint\n"
          scalars:
            # An instant. Parsed to a UTC DateTime, written as ISO 8601 UTC.
            DateTime:
              type: DateTime
              fromJsonFunctionName: dateTimeFromJson
              toJsonFunctionName: dateTimeToJson
              import: package:bogner_chess/core/api/scalars.dart
            # "2026-09-19". Kept as a string here; the mappers turn it into a
            # GameDate and treat a malformed value as "not known".
            LocalDate:
              type: String
            # Any JSON value: the analysis document, event properties.
            Any:
              type: Object
            Decimal:
              type: double
