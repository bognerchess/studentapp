name: PR

# Two jobs. `check` is the gate, tool/check.sh, exactly as a developer or an
# agent runs it locally; it is on Linux because that is the cheap and fast
# runner and nothing in the gate needs a Mac. `ios` is everything that does
# need one: the simulator build, the look into the built bundle, and the
# golden tests. docs/testing.md explains the split.

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the run for the previous push worthless, so cancel
# it. Runs on main are never cancelled: each of them is the record for a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow reads the repository and nothing else. No secrets are used, so
# it is safe to run for pull requests from forks.
permissions:
  contents: read

jobs:
  check:
    name: check (tool/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # environment.flutter in pubspec.yaml pins the exact version.
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Say which Flutter this is
        run: flutter --version
      - name: The gate
        run: tool/check.sh

  ios:
    name: ios (simulator build, bundled assets, goldens)
    # Which Xcode? Flutter 3.47 was developed against Xcode 27 (see
    # docs/building.md), and `macos-latest` moves on GitHub's schedule, not
    # ours. It is fine for a simulator debug build and for goldens, which
    # Flutter renders itself without Xcode. If a runner image update breaks the
    # build, pin the image (for example `macos-26`) and select the Xcode with
    # `sudo xcode-select -s /Applications/Xcode_<version>.app` in a first step.
    # The "Say which Xcode this is" step is there so the log answers the
    # question when that day comes.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Say which Xcode and Flutter this is
        run: |
          xcodebuild -version
          flutter --version
      - name: Build for the simulator
        # The fake configuration needs no backend and holds no secret. It
        # arrives with the app shell; until then the build takes no defines.
        run: |
          if [ -f config/fake.json ]; then
            flutter build ios --simulator --debug --dart-define-from-file=config/fake.json
          else
            flutter build ios --simulator --debug
          fi
      - name: Only allow-listed assets are in the bundle
        run: tool/check_bundled_assets.sh build/ios/iphonesimulator/Runner.app
      - name: Golden tests
        # Passes with a note while there are no golden tests yet.
        run: tool/golden.sh
      - name: Keep the golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
