name: bogner_chess
description: "Bogner Chess for iOS: enter or import a game, have it analysed, review it with coach comments."
publish_to: "none"

# <name>+<build>; release tags follow v<name>+<build>.
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  # Exact Flutter version. CI reads it from here (flutter-version-file), and
  # docs/building.md names the same one. Change both together.
  flutter: 3.47.5

# Every dependency needs a row in docs/dependencies.md (version, licence, why)
# before it is added here.
dependencies:
  flutter:
    sdk: flutter
  # The board. A trimmed copy vendored in this repository (three piece sets, no
  # board images); see third_party/chessground/BOGNER_CHANGES.md. Never from
  # pub.dev: the published package bundles about 40 piece sets.
  chessground:
    path: third_party/chessground
  dartchess: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
