query GameAnalysis($gameId: ID!, $maxSchemaVersion: Int!) {
  gameAnalysis(gameId: $gameId, maxSchemaVersion: $maxSchemaVersion) {
    id
    chessGameId
    schemaVersion
    schemaMinor
    createdAt
    document
    commentFeedback {
      ...FeedbackFields
    }
  }
}

mutation SubmitCoachCommentFeedback($input: SubmitCoachCommentFeedbackInput!) {
  submitCoachCommentFeedback(input: $input) {
    coachCommentFeedback {
      ...FeedbackFields
    }
    errors {
      __typename
      ... on BusinessError {
        message
      }
      ... on InputValidationError {
        message
        propertyName
      }
      ... on TechnicalError {
        message
      }
    }
  }
}

query MyAnalysisUsage {
  myAnalysisUsage {
    policy
    dailyLimit
    dailyUsed
    dailyResetAt
    monthlyLimit
    monthlyUsed
    monthlyResetAt
    queuedJobs
    maxQueuedJobs
  }
}
